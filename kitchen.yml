---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  chef_license: accept-no-persist
  policyfile: Policyfile.rb
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: opensuse-leap-16
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: default
    run_list:
      - recipe[test::default]
    attributes:
      mysql_test:
        installation: binary
    verifier:
      inspec_tests:
        - test/integration/default
  - name: package
    includes:
      - ubuntu-24.04
      - almalinux-9
    run_list:
      - recipe[test::default]
    attributes:
      mysql_test:
        installation: package
    verifier:
      inspec_tests:
        - test/integration/default
