---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: lint-unit
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        os:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - amazonlinux-2023
          - centos-stream-9
          - centos-stream-10
          - debian-12
          - debian-13
          - fedora-latest
          - opensuse-leap-16
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - default
        include:
          - os: ubuntu-2404
            suite: package
          - os: almalinux-9
            suite: package
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: actionshub/chef-install@6.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
      - name: Inspect the failed test instance
        if: failure()
        continue-on-error: true
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_INSTANCE: ${{ matrix.suite }}-${{ matrix.os }}
        run: >-
          kitchen exec "$KITCHEN_INSTANCE" -c
          '/opt/chef/embedded/bin/ruby /root/mysql-test-diagnostics.rb'
      - name: Upload Kitchen diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kitchen-${{ matrix.suite }}-${{ matrix.os }}
          path: .kitchen/logs
